<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>TransPortal Mockups</title>
<style>
  body{ margin:0; background:#0b0b10; color:#e2e8f0; font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  header{ padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.1); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1{ font-size:14px; margin:0 12px 0 0; }
  a{ color:#7dd3fc; text-decoration:none; } a:hover{ text-decoration:underline; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px; }
  .cell{ border:1px solid rgba(255,255,255,.1); border-radius:14px; overflow:hidden; background:#101018; }
  .cell h2{ margin:0; padding:9px 12px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#94a3b8; border-bottom:1px solid rgba(255,255,255,.08); }
  iframe{ width:100%; height:640px; border:0; background:#0b0b10; }
</style>
</head>
<body>
  <header>
    <h1>TransPortal · UI Mockups</h1>
    <a href="overlay-dark.html" target="_blank">overlay-dark</a>
    <a href="overlay-light.html" target="_blank">overlay-light</a>
    <a href="settings-dark.html" target="_blank">settings-dark</a>
    <a href="settings-light.html" target="_blank">settings-light</a>
  </header>
  <div class="grid">
    <div class="cell"><h2>Overlay · Dark</h2><iframe src="overlay-dark.html"></iframe></div>
    <div class="cell"><h2>Overlay · Light</h2><iframe src="overlay-light.html"></iframe></div>
    <div class="cell"><h2>Settings · Dark (borderless)</h2><iframe src="settings-dark.html"></iframe></div>
    <div class="cell"><h2>Settings · Light (borderless)</h2><iframe src="settings-light.html"></iframe></div>
  </div>
</body>
</html>
