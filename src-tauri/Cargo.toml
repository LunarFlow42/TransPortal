[package]
name = "transportal"
version = "0.1.3"
description = "TransPortal - lightweight desktop translation & dictionary workbench"
authors = ["LunarFlow42"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transportal_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 0.13 gates query/form and defaults to a different TLS backend. Keep native
# system certificates/proxies while explicitly retaining every provider API.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "query", "form"] }
eventsource-stream = "0.2"
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
redb = "5"
csv = "1"
lru = "0.19"
misaki-rs = { version = "0.11", default-features = false }
# Pin the pre-release Rust API and match the bundled ONNX Runtime 1.31.1 ABI.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-31"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
imageproc = { version = "0.27", default-features = false }
geo-clipper = "0.9"
geo-types = "0.7"
clipper-sys = "0.8"
base64 = "0.23"
libloading = "0.9"
sha2 = "0.11"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }
windows-collections = "0.3"
windows-future = "0.3"

# Wayland-only Linux integration: XDG portals, GTK clipboard/window handling,
# and /proc memory accounting. No Linux native crates enter Windows builds.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
libc = "0.2"
url = "2"
gtk = "0.18"

[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"
[profile.dev.package."*"]
debug = 0
opt-level = 2
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
