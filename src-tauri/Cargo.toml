[package]
name = "transportal"
version = "0.1.0"
description = "TransPortal - lightweight desktop translation & dictionary workbench"
authors = ["LunarFlow42"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transportal_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2.0"
redb = "2"
csv = "1"
lru = "0.12"
paddle-ocr-rs = { version = "=0.6.1", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
base64 = "0.22"
libloading = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }

# Linux backend (src/platform/linux). Phase 1 delegates to the unsupported
# backend and needs no extra crates. Phase 2 adds them here, one capability at
# a time, so they never reach Windows builds:
#   ashpd              XDG portals: Screenshot, ScreenCast, GlobalShortcuts, RemoteDesktop
#   pipewire           frames from the ScreenCast portal (auto region translation)
#   atspi              AT-SPI accessibility bus: reading the selection
#   reis               libei: synthesized copy/paste and key observation
#   wayland-client / wayland-protocols(-wlr)   data-control clipboard events
[target.'cfg(target_os = "linux")'.dependencies]

[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"
[profile.dev.package."*"]
debug = 0
opt-level = 2
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
